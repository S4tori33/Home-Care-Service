<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Dashboard - Home Care Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/dashboard.css">
  <style>
    .job-card { background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px; }
    .job-title { font-weight:600;color:#111827; }
    .meta { font-size:13px;color:#6b7280;margin-top:6px; }
    .actions { margin-top:12px;display:flex;gap:8px;flex-wrap:wrap; }
    .btn-a { padding:8px 14px;border-radius:8px;border:none;font-weight:600;cursor:pointer;color:#fff; }
    .acc { background:#059669; }
    .dec { background:#6b7280; }
    .msg { background:#3b82f6; }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="sidebar-toggle" id="sidebarToggle"><span></span><span></span><span></span></button>
    <a href="#" class="navbar-brand">
      <div class="navbar-logo">HCS</div>
      <div class="navbar-brand-text">
        <h1>Home Care Service</h1>
        <p>Provider</p>
      </div>
    </a>
    <div class="navbar-links">
      <a href="../home.html">Home</a>
      <a href="../pages/messaging.html">Messages</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-profile">
      <div class="avatar-wrap">
        <div class="avatar" id="avatarEl">P</div>
      </div>
      <div class="sidebar-user-name" id="userName">Provider</div>
      <div class="sidebar-user-role" id="userRole">Service</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrap">
    <div class="dashboard-shell">
      <div class="dashboard-header">
        <h1>Welcome, <span id="headerName">Provider</span></h1>
        <p class="dashboard-subtitle" id="subTitle">Your assigned jobs</p>
      </div>

      <h2 style="font-size:18px;margin-bottom:12px;">Needs your response</h2>
      <div id="assignedList"></div>

      <h2 style="font-size:18px;margin:24px 0 12px;">Active</h2>
      <div id="activeList"></div>

      <h2 style="font-size:18px;margin:24px 0 12px;">Completed</h2>
      <div id="doneList"></div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (!auth.getCurrentUser()) window.location.href = '../pages/userLogin.html';
    const role = auth.getUserRole();
    const ok = role && ['caregiver','pet_care','garden_maintenance','house_cleaning'].includes(role.id);
    if (!ok) window.location.href = '../pages/userLogin.html';

    dashboard.initializeDashboard();

    const me = auth.getCurrentUser();

    function customerLabel(booking) {
      const uid = booking.userId || booking.customerId;
      const u = uid ? auth.getUserById(uid) : null;
      return u ? `${u.firstName} ${u.lastName}` : 'Customer';
    }

    function render() {
      const mine = auth.getUserBookings(me.id, role.id);
      const need = mine.filter(b => b.status === 'assigned');
      const active = mine.filter(b => b.status === 'accepted');
      const done = mine.filter(b => b.status === 'completed');

      function card(b, mode) {
        const uid = b.userId || b.customerId;
        return `<div class="job-card">
          <div class="job-title">${b.serviceType}</div>
          <div class="meta">Client: ${customerLabel(b)} · ${b.status}</div>
          <div class="actions">
            ${mode === 'need' ? `
              <button type="button" class="btn-a accept" data-id="${b.id}">Accept</button>
              <button type="button" class="btn-a dec decline" data-id="${b.id}">Decline</button>
            ` : ''}
            ${mode === 'active' ? `
              <button type="button" class="btn-a msg" data-uid="${uid}">Message client</button>
              <button type="button" class="btn-a acc complete" data-id="${b.id}">Mark complete</button>
            ` : ''}
          </div>
        </div>`;
      }

      document.getElementById('assignedList').innerHTML =
        need.length ? need.map(b => card(b, 'need')).join('') : '<p style="color:#9ca3af;">No jobs awaiting acceptance.</p>';
      document.getElementById('activeList').innerHTML =
        active.length ? active.map(b => card(b, 'active')).join('') : '<p style="color:#9ca3af;">No active jobs.</p>';
      document.getElementById('doneList').innerHTML =
        done.length ? done.map(b => card(b, 'done')).join('') : '<p style="color:#9ca3af;">None yet.</p>';

      document.querySelectorAll('.accept').forEach(btn => {
        btn.addEventListener('click', () => {
          auth.updateBooking(btn.getAttribute('data-id'), { status: 'accepted' });
          render();
          dashboard.showNotification('Job accepted — messaging is now available.', 'success');
        });
      });
      document.querySelectorAll('.decline').forEach(btn => {
        btn.addEventListener('click', () => {
          auth.updateBooking(btn.getAttribute('data-id'), { status: 'pending', providerId: null });
          render();
        });
      });
      document.querySelectorAll('.complete').forEach(btn => {
        btn.addEventListener('click', () => {
          auth.updateBooking(btn.getAttribute('data-id'), { status: 'completed', completedAt: new Date().toISOString() });
          render();
        });
      });
      document.querySelectorAll('.msg').forEach(btn => {
        btn.addEventListener('click', () => {
          const uid = btn.getAttribute('data-uid');
          window.location.href = '../pages/messaging.html?with=' + encodeURIComponent(uid);
        });
      });
    }

    document.getElementById('logoutLink').addEventListener('click', e => {
      e.preventDefault();
      dashboard.logout();
    });

    render();
  </script>
</body>
</html>
