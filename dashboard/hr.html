<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Admin - Home Care Service</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
  <style>
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
    th { background: #ecfdf5; color: #047857; font-weight: 600; }
    select { padding: 6px; border-radius: 6px; max-width: 160px; }
    button { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; margin-right: 4px; }
    .ok { background: #059669; color: #fff; }
    .no { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="sidebar-toggle" id="sidebarToggle"><span></span><span></span><span></span></button>
    <a href="#" class="navbar-brand">
      <div class="navbar-logo">HCS</div>
      <div class="navbar-brand-text"><h1>Home Care Service</h1><p>HR</p></div>
    </a>
    <div class="navbar-links">
      <a href="../home.html">Home</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-profile">
      <div class="avatar-wrap"><div class="avatar" id="avatarEl">HR</div></div>
      <div class="sidebar-user-name" id="userName">HR Admin</div>
      <div class="sidebar-user-role" id="userRole">Hiring</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrap">
    <div class="dashboard-shell">
      <div class="dashboard-header">
        <h1>Job applications</h1>
        <p class="dashboard-subtitle">Approve applicants into a provider role or reject.</p>
      </div>
      <table>
        <thead><tr><th>Applicant</th><th>Email</th><th>Status</th><th>Role if approved</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (!auth.getCurrentUser()) window.location.href = '../pages/userLogin.html';
    if (auth.getUserRole().id !== 'hr_admin') window.location.href = '../pages/userLogin.html';

    dashboard.initializeDashboard();

    const PROVIDER_ROLES = [
      { v: 'caregiver', l: 'Caregiver' },
      { v: 'pet_care', l: 'Pet care' },
      { v: 'garden_maintenance', l: 'Garden' },
      { v: 'house_cleaning', l: 'Cleaning' }
    ];

    function render() {
      const apps = auth.getApplications();
      document.getElementById('tbody').innerHTML = apps.length
        ? apps.map(a => {
            const roleSel = PROVIDER_ROLES.map(o =>
              `<option value="${o.v}" ${o.v === (a.desiredRole || 'caregiver') ? 'selected' : ''}>${o.l}</option>`
            ).join('');
            const done = a.status !== 'pending';
            return `<tr>
              <td>${a.firstName} ${a.lastName}</td>
              <td>${a.email}</td>
              <td>${a.status}</td>
              <td><select data-app="${a.id}" class="role-pick" ${done ? 'disabled' : ''}>${roleSel}</select></td>
              <td>
                ${done ? '—' : `
                  <button type="button" class="ok appr" data-app="${a.id}">Approve</button>
                  <button type="button" class="no rej" data-app="${a.id}">Reject</button>`}
              </td>
            </tr>`;
          }).join('')
        : '<tr><td colspan="5" style="padding:24px;text-align:center;color:#9ca3af;">No applications yet. Sign up as job seeker from the login page to create one.</td></tr>';

      document.querySelectorAll('.appr').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-app');
          const sel = document.querySelector(`select.role-pick[data-app="${id}"]`);
          auth.approveApplication(id, sel.value);
          dashboard.showNotification('Application approved', 'success');
          render();
        });
      });
      document.querySelectorAll('.rej').forEach(btn => {
        btn.addEventListener('click', () => {
          auth.rejectApplication(btn.getAttribute('data-app'));
          dashboard.showNotification('Application rejected', 'success');
          render();
        });
      });
    }

    document.getElementById('logoutLink').addEventListener('click', e => {
      e.preventDefault();
      dashboard.logout();
    });

    render();
  </script>
</body>
</html>
