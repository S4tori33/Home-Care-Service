<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Home Care Service</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
  <style>
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f3f4f6; }
    th { background: #f5f3ff; color: #5b21b6; font-weight: 600; }
    button { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; background: #8b5cf6; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="sidebar-toggle" id="sidebarToggle"><span></span><span></span><span></span></button>
    <a href="#" class="navbar-brand">
      <div class="navbar-logo">HCS</div>
      <div class="navbar-brand-text"><h1>Home Care Service</h1><p>Support</p></div>
    </a>
    <div class="navbar-links">
      <a href="../home.html">Home</a>
      <a href="../pages/messaging.html">Messages</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-profile">
      <div class="avatar-wrap"><div class="avatar" id="avatarEl">S</div></div>
      <div class="sidebar-user-name" id="userName">Support</div>
      <div class="sidebar-user-role" id="userRole">Agent</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrap">
    <div class="dashboard-shell">
      <div class="dashboard-header">
        <h1>Support issues</h1>
        <p class="dashboard-subtitle">Resolve tickets submitted by users.</p>
      </div>
      <table>
        <thead><tr><th>Subject</th><th>User</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (!auth.getCurrentUser()) window.location.href = '../pages/userLogin.html';
    if (auth.getUserRole().id !== 'customer_support') window.location.href = '../pages/userLogin.html';

    dashboard.initializeDashboard();

    function render() {
      const issues = auth.getIssues().slice().reverse();
      document.getElementById('tbody').innerHTML = issues.length
        ? issues.map(i => {
            const u = auth.getUserById(i.userId);
            return `<tr>
              <td>${i.subject}<div style="font-size:11px;color:#6b7280;margin-top:4px;">${i.detail || ''}</div></td>
              <td>${u ? u.email : i.userId}</td>
              <td>${i.status}</td>
              <td>${i.status === 'open' ? `<button type="button" class="res" data-id="${i.id}">Resolve</button>` : '—'}</td>
            </tr>`;
          }).join('')
        : '<tr><td colspan="4" style="padding:24px;text-align:center;color:#9ca3af;">No issues logged.</td></tr>';

      document.querySelectorAll('.res').forEach(btn => {
        btn.addEventListener('click', () => {
          auth.updateIssueStatus(btn.getAttribute('data-id'), 'resolved');
          render();
        });
      });
    }

    document.getElementById('logoutLink').addEventListener('click', e => {
      e.preventDefault();
      dashboard.logout();
    });

    render();
  </script>
</body>
</html>
