<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations - Home Care Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/dashboard.css">
  <style>
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb; }
    th, td { padding: 12px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #f3f4f6; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    select { padding: 6px 8px; border-radius: 6px; border: 1px solid #e5e7eb; max-width: 160px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .b-pending { background: #fef3c7; color: #92400e; }
    .b-assigned { background: #dbeafe; color: #1e40af; }
    .b-accepted { background: #d1fae5; color: #065f46; }
    .b-completed { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="sidebar-toggle" id="sidebarToggle"><span></span><span></span><span></span></button>
    <a href="#" class="navbar-brand">
      <div class="navbar-logo">HCS</div>
      <div class="navbar-brand-text">
        <h1>Home Care Service</h1>
        <p>Operations</p>
      </div>
    </a>
    <div class="navbar-links">
      <a href="../home.html">Home</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-profile">
      <div class="avatar-wrap">
        <div class="avatar" id="avatarEl">OP</div>
      </div>
      <div class="sidebar-user-name" id="userName">Operations</div>
      <div class="sidebar-user-role" id="userRole">Admin</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrap">
    <div class="dashboard-shell">
      <div class="dashboard-header">
        <h1>Bookings & assignments</h1>
        <p class="dashboard-subtitle">Assign the correct provider for each service type.</p>
      </div>
      <div style="overflow:auto;">
        <table id="bookingTable">
          <thead>
            <tr>
              <th>Service</th>
              <th>Customer</th>
              <th>Status</th>
              <th>Assign provider</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (!auth.getCurrentUser()) window.location.href = '../pages/userLogin.html';
    if (auth.getUserRole().id !== 'operations_admin') {
      window.location.href = '../pages/userLogin.html';
    }

    dashboard.initializeDashboard();

    const SERVICE_ROLE = {
      'Elderly Care': 'caregiver',
      'Pet Care': 'pet_care',
      'Garden Maintenance': 'garden_maintenance',
      'House Cleaning': 'house_cleaning'
    };

    function providersFor(booking) {
      const r = SERVICE_ROLE[booking.serviceType];
      return auth.getAllUsers().filter(u => u.role === r && u.status !== 'banned');
    }

    function badgeClass(status) {
      if (status === 'pending') return 'badge b-pending';
      if (status === 'assigned') return 'badge b-assigned';
      if (status === 'accepted') return 'badge b-accepted';
      if (status === 'completed') return 'badge b-completed';
      return 'badge';
    }

    function render() {
      const tbody = document.querySelector('#bookingTable tbody');
      const bookings = auth.getAllBookings().slice().reverse();
      tbody.innerHTML = bookings.map(b => {
        const cid = b.userId || b.customerId;
        const customer = cid ? auth.getUserById(cid) : null;
        const opts = providersFor(b).map(p =>
          `<option value="${p.id}" ${p.id === b.providerId ? 'selected' : ''}>${p.firstName} ${p.lastName}</option>`
        ).join('');
        const selectHtml = b.status === 'completed'
          ? '<em style="color:#9ca3af;">Closed</em>'
          : `<select class="prov-select" data-booking="${b.id}">
               <option value="">Choose provider…</option>${opts}
             </select>`;

        return `<tr>
          <td>${b.serviceType}</td>
          <td>${customer ? customer.email : '—'}</td>
          <td><span class="${badgeClass(b.status)}">${b.status}</span></td>
          <td>${selectHtml}</td>
          <td>${b.status !== 'completed' ? `<button type="button" class="assign-btn" data-booking="${b.id}" style="padding:8px 12px;border-radius:8px;border:none;background:#d97706;color:#fff;font-weight:600;cursor:pointer;">Assign</button>` : ''}</td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('.assign-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const bid = btn.getAttribute('data-booking');
          const sel = tbody.querySelector(`select.prov-select[data-booking="${bid}"]`);
          const pid = sel && sel.value;
          if (!pid) {
            alert('Select a provider first.');
            return;
          }
          auth.assignProvider(bid, pid);
          render();
          dashboard.showNotification('Provider assigned', 'success');
        });
      });
    }

    document.getElementById('logoutLink').addEventListener('click', e => {
      e.preventDefault();
      dashboard.logout();
    });

    render();
  </script>
</body>
</html>
