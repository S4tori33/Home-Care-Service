<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderator - Home Care Service</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
  <style>
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f3f4f6; }
    th { background: #fef2f2; color: #b91c1c; font-weight: 600; }
    button { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; margin-right: 4px; }
    .flag { background: #fed7aa; color: #9a3412; }
    .ban { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="sidebar-toggle" id="sidebarToggle"><span></span><span></span><span></span></button>
    <a href="#" class="navbar-brand">
      <div class="navbar-logo">HCS</div>
      <div class="navbar-brand-text"><h1>Home Care Service</h1><p>Moderator</p></div>
    </a>
    <div class="navbar-links">
      <a href="../home.html">Home</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-profile">
      <div class="avatar-wrap"><div class="avatar" id="avatarEl">M</div></div>
      <div class="sidebar-user-name" id="userName">Moderator</div>
      <div class="sidebar-user-role" id="userRole">Trust & Safety</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main-wrap">
    <div class="dashboard-shell">
      <div class="dashboard-header">
        <h1>Community review</h1>
        <p class="dashboard-subtitle">Flag issues from open support tickets; suspend abusive accounts.</p>
      </div>
      <table>
        <thead><tr><th>Open issues</th><th>User</th><th>Action</th></tr></thead>
        <tbody id="issueRows"></tbody>
      </table>

      <div class="dashboard-header" style="margin-top:32px;">
        <h2 style="font-size:18px;">All users (quick ban)</h2>
      </div>
      <table>
        <thead><tr><th>Email</th><th>Role</th><th></th></tr></thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    if (!auth.getCurrentUser()) window.location.href = '../pages/userLogin.html';
    if (auth.getUserRole().id !== 'moderator') window.location.href = '../pages/userLogin.html';

    dashboard.initializeDashboard();

    function renderIssues() {
      const open = auth.getIssues().filter(i => i.status === 'open');
      document.getElementById('issueRows').innerHTML = open.length
        ? open.map(i => {
            const u = auth.getUserById(i.userId);
            return `<tr>
              <td>${i.subject}</td>
              <td>${u ? u.email : ''}</td>
              <td><button type="button" class="flag" data-id="${i.id}">Close ticket</button></td>
            </tr>`;
          }).join('')
        : '<tr><td colspan="3" style="padding:16px;color:#9ca3af;">No open issues.</td></tr>';

      document.querySelectorAll('.flag').forEach(btn => {
        btn.addEventListener('click', () => {
          auth.updateIssueStatus(btn.getAttribute('data-id'), 'resolved');
          renderIssues();
        });
      });
    }

    function renderUsers() {
      document.getElementById('userRows').innerHTML = auth.getAllUsers().map(u => {
        if (['super_admin','moderator'].includes(u.role)) {
          return `<tr><td>${u.email}</td><td>${u.role}</td><td><em>protected</em></td></tr>`;
        }
        return `<tr>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>${u.status !== 'banned'
            ? `<button type="button" class="ban" data-id="${u.id}">Ban user</button>`
            : 'banned'}</td>
        </tr>`;
      }).join('');

      document.querySelectorAll('.ban').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!confirm('Ban this user?')) return;
          auth.setUserStatus(btn.getAttribute('data-id'), 'banned');
          renderUsers();
        });
      });
    }

    document.getElementById('logoutLink').addEventListener('click', e => {
      e.preventDefault();
      dashboard.logout();
    });

    renderIssues();
    renderUsers();
  </script>
</body>
</html>
