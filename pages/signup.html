<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/userLogin.css">
</head>
<body>

    <section class="hero">

        <a href="../index.html" class="back-link" aria-label="Return to login">←</a>

        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon"><span>HCS</span></div>
            <div class="brand-text">
                <h1>Home Care Service</h1>
                <p>Quality Care, Quality Life</p>
            </div>
        </div>

        <!-- Form Container -->
        <div class="form-container">

            <div style="text-align:center; margin-bottom:22px;">
                <h2 style="font-family:'Outfit',sans-serif;font-weight:700;font-size:1.5rem;color:#fff;margin-bottom:5px;">Create Your Account</h2>
                <p style="font-size:13px;color:var(--text-muted);">Join HCS and access trusted care services</p>
            </div>

            <!-- Step indicator -->
            <div class="steps" id="stepIndicator">
                <div class="step active" id="step-ind-1">
                    <div class="step-dot">1</div>
                    <div class="step-label">Personal</div>
                </div>
                <div class="step-line" id="line-1"></div>
                <div class="step" id="step-ind-2">
                    <div class="step-dot">2</div>
                    <div class="step-label">Credentials</div>
                </div>
            </div>

            <div class="form-steps">

                <!-- STEP 1: Personal -->
                <div class="form-step active" id="step1">
                    <div class="name-row">
                        <div class="form-group">
                            <label class="form-label" for="firstName">First Name *</label>
                            <input type="text" id="firstName" class="form-input" placeholder="Juan" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="lastName">Last Name *</label>
                            <input type="text" id="lastName" class="form-input" placeholder="Cruz" required>
                        </div>
                    </div>
                    <div class="name-row">
                        <div class="form-group">
                            <label class="form-label" for="lmiddlename">Middle Name</label>
                            <input type="text" id="middlename" class="form-input" placeholder="Dela" >
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="suffix">Suffix</label>
                            <input type="text" id="suffix" class="form-input" placeholder="Jr." >
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="dob">Date of Birth *</label>
                        <input type="date" id="dob" class="form-input" max="2008-05-05" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number *</label>
                        <input type="tel" id="phone" class="form-input" placeholder="+63 9XX XXX XXXX">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regEmail">Email Address *</label>
                        <input type="email" id="regEmail" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <div id="err1" style="color:#ffb3b3;font-size:12px;margin-bottom:10px;display:none;"></div>
                    <div class="form-actions">
                        <button class="btn btn-primary" onclick="nextStep(1)">Continue →</button>
                    </div>
                </div>

                <!-- STEP 2: Credentials -->
                <div class="form-step" id="step2">
                    <div class="form-group">
                        <label class="form-label" for="address">Address *</label>
                        <input type="text" id="address" class="form-input" placeholder="Street, City, Province">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="regPassword">Password *</label>
                        <input type="password" id="regPassword" class="form-input" placeholder="Create a strong password" maxlength="30" oninput="checkStrength(this.value)">
                        <div class="strength-bar">
                            <div class="strength-seg" id="s1"></div>
                            <div class="strength-seg" id="s2"></div>
                            <div class="strength-seg" id="s3"></div>
                            <div class="strength-seg" id="s4"></div>
                        </div>
                        <div class="strength-hint" id="strengthHint">Enter a password *</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regConfirm">Confirm Password *</label>
                        <input type="password" id="regConfirm" class="form-input" placeholder="Repeat your password" maxlength="30">
                    </div>
                    <div id="err2" style="color:#ffb3b3;font-size:12px;margin-bottom:10px;display:none;"></div>

                    <div class="terms-row">
                        <input type="checkbox" id="terms">
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> of Home Care Service.</label>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" onclick="submitSignup()">Create Account</button>
                        <button class="btn-back" onclick="prevStep(2)">← Back</button>
                    </div>
                </div>

            </div><!-- /.form-steps -->

            <!-- Success -->
            <div class="success-screen" id="successScreen">
                <div class="success-icon">✓</div>
                <h3>Account Created!</h3>
                <p>Welcome to Home Care Service.<br>Please log in to get started.</p>
                <div class="form-actions">
                    <button class="btn btn-primary" onclick="window.location.href='../index.html'">Go to Login</button>
                </div>
            </div>

            <div class="login-link" id="loginLinkRow">
                Already have an account? <a href="../index.html">Log In</a>
            </div>

        </div><!-- /.form-container -->

    </section>

    <script>
        let currentStep = 1;

        function nextStep(from) {
            if (!validateStep(from)) return;
            currentStep = from + 1;
            document.getElementById('step' + from).classList.remove('active');
            document.getElementById('step' + currentStep).classList.add('active');
            updateIndicator();
        }
        function prevStep(from) {
            currentStep = from - 1;
            document.getElementById('step' + from).classList.remove('active');
            document.getElementById('step' + currentStep).classList.add('active');
            updateIndicator();
        }
        function updateIndicator() {
            for (let i = 1; i <= 2; i++) {
                const ind = document.getElementById('step-ind-' + i);
                ind.classList.remove('active','done');
                if (i < currentStep) ind.classList.add('done');
                if (i === currentStep) ind.classList.add('active');
            }
            document.getElementById('line-1').classList.toggle('done', currentStep > 1);
        }
        function validateStep(step) {
            const err = document.getElementById('err' + step);
            err.style.display = 'none';
            if (step === 1) {
                if (!document.getElementById('firstName').value.trim() ||
                    !document.getElementById('lastName').value.trim()) {
                    return showErr(err, 'Please enter your first and last name.');
                }
            }
            if (step === 2) {
                const em = document.getElementById('regEmail').value.trim();
                const pw = document.getElementById('regPassword').value;
                const cp = document.getElementById('regConfirm').value;
                if (!em || !/\S+@\S+\.\S+/.test(em)) return showErr(err, 'Please enter a valid email.');
                if (pw.length < 6) return showErr(err, 'Password must be at least 6 characters.');
                if (pw !== cp)     return showErr(err, 'Passwords do not match.');
                if (!document.getElementById('terms').checked) return showErr(err, 'Please accept the Terms of Service to continue.');
            }
            return true;
        }
        function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; return false; }

        function submitSignup() {
            if (!validateStep(2)) return;

            // Hide form, show success
            document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
            document.getElementById('stepIndicator').style.display = 'none';
            document.getElementById('loginLinkRow').style.display  = 'none';
            document.querySelector('.form-container > div:first-child').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
        }

        function checkStrength(val) {
            const segs  = ['s1','s2','s3','s4'].map(id => document.getElementById(id));
            const hint  = document.getElementById('strengthHint');
            const cols  = ['#ff6b6b','#ffa726','#c8e06b','rgba(255,255,255,0.7)'];
            const names = ['Weak','Fair','Good','Strong'];
            let score = 0;
            if (val.length >= 6)  score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            segs.forEach((s, i) => {
                s.style.background = i < score ? cols[score - 1] : 'rgba(255,255,255,0.12)';
            });
            hint.textContent = val.length === 0 ? 'Enter a password' : (names[score - 1] || 'Too short');
            hint.style.color  = val.length === 0 ? 'rgba(255,255,255,0.3)' : cols[score - 1] || '#ff6b6b';
        }
    </script>

</body>
</html>
