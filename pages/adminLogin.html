<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <!-- Reuse user login styling for admin login -->
    <link rel="stylesheet" href="../styles/userLogin.css">
</head>
<body>

    <section class="hero">

        <!-- Brand / Logo -->
        <div class="brand">
            <div class="brand-icon">
                <span>HCS</span>
            </div>
            <div class="brand-text">
                <h1>Home Care Service</h1>
                <p>Quality Care, Quality Life</p>
            </div>
        </div>

        <!-- Back link -->
        <a href="../home.html" class="btn btn-secondary back-link" aria-label="Return">←</a>

        <!-- Form Container -->
        <div class="form-container">
            <div class="form-tabs" id="formTabs">
                <button class="tab-btn active" data-form="admin">Admin Login</button>
                <div class="tab-slider"></div>
            </div>

            <form class="form active" id="adminForm">
                <div class="form-group">
                    <label class="form-label" for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="Enter your admin email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="Enter your password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>

                <p class="form-note">Need a user account instead? <a href="userLogin.html">Log in here</a>.</p>
            </form>
        </div>

    </section>

    <footer>
        <p>© 2026 Home Care Service (HCS). All Rights Reserved.</p>
    </footer>

    <script src="../js/adminLogin.js"></script>

</body>
</html>
