<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/userLogin.css">
</head>
<body>

    <section class="hero">
        
        <!-- Brand / Logo -->
        <div class="brand">
            <div class="brand-icon">
                <span>HCS</span>
            </div>
            <div class="brand-text">
                <h1>Home Care Service</h1>
                <p>Quality Care, Quality Life</p>
            </div>
        </div>

        <!-- Form Container -->
        <a href="../home.html" class="btn btn-secondary back-link" aria-label="Return">←</a>
        <div class="form-container">
            <!-- Login Form -->
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: #ffffff;">Login</h2>
                
            </div>
            
            <form class="form active" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="Enter password" required maxlength="12" value="123456">
                </div>
                <div id="loginError" style="color: #d32f2f; font-size: 12px; margin-bottom: 10px; display: none;"></div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Log In</button>
                </div>
                <br> <br>
                <div id="signup">
                    <p style="color:white;"> Don't have an account yet? <a href="/pages/signup.html"> Sign Up </a></p>
                </div>
            </form>

            </div>
